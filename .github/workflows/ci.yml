name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check entrypoint
        run: test -f index.html
      - name: Check local references
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const refs = [...html.matchAll(/(?:href|src)="([^"]+)"/g)].map(m => m[1])
              .filter(u => !/^(https?:|mailto:|tel:|data:|#|\/\/)/.test(u));
            let bad = 0;
            for (const r of refs) {
              if (!fs.existsSync(r)) { console.log("missing: " + r); bad++; }
            }
            if (bad) process.exit(1);
            console.log("checked " + refs.length + " local references");
          '
      - name: Check tag balance
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            for (const t of ["div", "section", "form", "ul"]) {
              const open = (html.match(new RegExp("<" + t + "\\b", "g")) || []).length;
              const close = (html.match(new RegExp("</" + t + ">", "g")) || []).length;
              if (open !== close) {
                console.log(t + ": " + open + " open vs " + close + " close");
                process.exit(1);
              }
            }
            console.log("tag balance ok");
          '